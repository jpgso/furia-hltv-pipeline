<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>FURIA em dados: análise completa</title>
<meta name="description" content="Mapas, jogadores, vetos, adversários e campeonatos da FURIA no Counter-Strike, com filtros por período, formação, jogador e mapa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comum.css?v=3.0.0">
<script defer src="comum.js?v=3.0.0"></script>
<script defer src="analise.js?v=3.0.0"></script>
<style>
main,footer{padding:0 var(--mg)}
h1{font:900 clamp(54px,13.5vw,220px)/.84 var(--tx);font-stretch:125%;letter-spacing:-.045em;margin:30px 0 0 -.05em}
.sub{font:300 clamp(20px,2.7vw,38px)/1.1 var(--tx);font-stretch:75%;max-width:30em;margin:16px 0 26px}
.abas{display:flex;gap:0;overflow-x:auto;border-bottom:3px solid var(--ink);margin:26px 0 22px}
.aba{background:none;border:0;font-weight:800;font-size:16px;padding:9px 15px;cursor:pointer;white-space:nowrap}
.aba:hover{background:var(--am)}
.aba.on{background:var(--ink);color:#fff}
h2{font:800 20px/1.2 var(--tx);border-top:6px solid var(--ink);padding-top:8px;margin:34px 0 4px}
h2+.nota{margin-bottom:14px;max-width:80ch}
h2+.cifras{margin-top:10px}
#conteudo>h2:first-child{margin-top:0}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 40px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 40px}

/* Números em destaque, separados por fios. */
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px 0;margin-bottom:6px}
.cifras div{border-left:1px solid var(--ink);padding:0 14px}
.cifras b{display:block;font:900 clamp(30px,3.6vw,50px)/1 var(--tx);font-stretch:80%;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cifras span{font-size:13px;color:var(--cz)}

/* Campo de mapas: um quadrado por mapa. */
.campo{display:grid;grid-template-columns:repeat(auto-fill,13px);gap:3px;margin-top:10px}
.campo i{aspect-ratio:1;border:2px solid var(--c);background:var(--c)}
.campo i.d{background:none}
.campo b{grid-column:span 2;font:800 12px/13px var(--tx);font-stretch:62%}
.leg{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:13px;margin-top:10px}
.leg i{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px;border:2px solid var(--ink)}

/* Calendário e grades de calor. */
.cal{display:grid;grid-template-columns:44px repeat(12,minmax(0,1fr));gap:3px;max-width:760px;font-size:12px;align-items:center}
.cal>span{text-align:center;color:var(--cz)}
.cal>b{font-weight:800}
.cal>div{aspect-ratio:1;display:grid;place-items:center;background:#f3f1ea}
.cal>div i{display:block;width:var(--t);height:var(--t);border:2px solid var(--ink);background:var(--ink)}
.cal>div i.d{background:none}
.heat{display:grid;grid-template-columns:minmax(74px,auto) repeat(var(--n),minmax(38px,1fr));gap:2px;font-size:12px;overflow-x:auto}
.heat>span{text-align:center;color:var(--cz);padding-bottom:3px;white-space:nowrap}
.heat>b{font-weight:700;padding-right:8px;white-space:nowrap;align-self:center}
.heat>div{text-align:center;padding:7px 2px;font-variant-numeric:tabular-nums;background:#f3f1ea}

/* CT contra TR: dois pontos na mesma régua. */
.regua{display:grid;gap:9px;font-size:14px}
.regua>div{display:grid;grid-template-columns:96px 1fr 92px;gap:10px;align-items:center}
.regua .tr{position:relative;height:14px;background:linear-gradient(90deg,transparent calc(50% - .5px),var(--ink) 0 calc(50% + .5px),transparent 0),#f3f1ea}
.regua .tr i{position:absolute;top:0;width:14px;height:14px;margin-left:-7px;border-radius:50%;left:var(--x)}
.regua .tr u{position:absolute;top:6px;height:2px;background:var(--ink);left:var(--a);width:var(--w)}
.regua small{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}

.tw{overflow-x:auto}
.tw+.nota,.heat+.nota{margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:800;font-size:13px;padding:8px 10px;border-bottom:3px solid var(--ink);white-space:nowrap;cursor:pointer;text-align:right;user-select:none}
th:hover{background:var(--am)}
th.e,td.e{text-align:left}
td{padding:7px 10px;border-bottom:1px solid var(--fio);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.e{font-weight:600}
td.q{white-space:normal;min-width:180px}
tr:hover td{box-shadow:inset 0 -2px 0 var(--ink)}
td a{font-weight:700}
td .bi{display:inline-block;height:9px;background:var(--ink);margin-right:7px;vertical-align:0;min-width:1px}
.r{display:inline-grid;place-items:center;width:22px;height:22px;font-weight:800;font-size:12px;border:2px solid var(--ink)}
.r.v{background:var(--ink);color:#fff}
.pag{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:14px}
.seg{display:inline-flex;border:2px solid var(--ink);margin-bottom:16px}
.seg button{background:none;border:0;font-weight:800;padding:5px 16px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
footer{margin-top:70px;padding-bottom:50px;font-size:13px;color:var(--cz)}
footer p{border-top:1px solid var(--ink);padding-top:12px;max-width:100ch}
@media(max-width:860px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.regua>div{grid-template-columns:76px 1fr 84px}.campo{grid-template-columns:repeat(auto-fill,9px);gap:2px}.campo i{border-width:1.5px}.campo b{grid-column:span 3;font-size:11px;line-height:9px}}
</style>
</head>
<body class="poster">
<header class="topo">
  <a class="marca" href="index.html">FURIA em dados</a>
  <nav><a href="index.html">Voltar ao álbum</a></nav>
  <span id="atualizado"></span>
</header>
<main>
  <h1><span id="h-n">1.747</span> mapas</h1>
  <p class="sub" id="h-s">Carregando os dados.</p>
  <div class="filtros" id="filtros"></div>
  <div class="abas" id="abas" role="tablist"></div>
  <div id="conteudo"></div>
</main>
<footer><p>Projeto de fã, sem vínculo com a FURIA. Dados da HLTV.org. O rating mistura as versões 2.0 (até outubro de 2023) e 3.0 da HLTV. Mapas sem disputa (W.O.) ficam fora das estatísticas. Código no <a href="https://github.com/jpgso/furia-hltv-pipeline">GitHub</a>.</p></footer>
</body>
</html>
